# Stack CCA (colegiaturas.com). Basado en cca/docker-compose.yml, sin Caddy (lo reemplaza
# edge_nginx) y sin Postgres local (Strapi y Portal usan el cluster de DigitalOcean).
#
#   cca_cms    -> cms-web.colegiaturas.com        (Strapi, :1337)
#   cca_web    -> web.colegiaturas.com            (Astro estático servido por nginx, :80)
#   cca_portal -> portal-padres.colegiaturas.com  (NestJS + SPA, :3000)
#
# cca_web hornea el contenido de Strapi EN BUILD TIME desde STRAPI_PUBLIC_URL (URL pública),
# así que cca_cms debe estar en línea con su certificado antes de construir cca_web.
# scripts/deploy.sh cca y scripts/rebuild-web.sh respetan ese orden.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-do-postgres-ca: &do-postgres-ca
  type: bind
  source: ./secrets/do-postgres-ca.crt
  target: /certs/do-postgres-ca.crt
  read_only: true

services:
  cca_cms:
    build:
      context: ${CCA_DIR:?falta CCA_DIR en .env}
      dockerfile: apps/cms/Dockerfile
    image: vps/cca-cms:latest
    container_name: cca_cms
    restart: always
    env_file:
      - ./stacks/cca/cms.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      # CA del cluster de DigitalOcean: permite verificar TLS sin rejectUnauthorized=false.
      NODE_EXTRA_CA_CERTS: /certs/do-postgres-ca.crt
    volumes:
      - cms_uploads:/app/apps/cms/public/uploads
      - *do-postgres-ca
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1337/_health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging
    networks:
      - edge
      - services

  cca_web:
    build:
      context: ${CCA_DIR}
      dockerfile: apps/web/Dockerfile
      args:
        STRAPI_URL: ${STRAPI_PUBLIC_URL:-https://cms-web.colegiaturas.com}
    image: vps/cca-web:latest
    container_name: cca_web
    restart: always
    logging: *default-logging
    networks:
      - edge

  cca_portal:
    build:
      context: ${CCA_DIR}
      dockerfile: apps/portal-api/Dockerfile
    image: vps/cca-portal:latest
    container_name: cca_portal
    restart: always
    env_file:
      - ./stacks/cca/portal.env
    environment:
      NODE_EXTRA_CA_CERTS: /certs/do-postgres-ca.crt
    volumes:
      - *do-postgres-ca
    logging: *default-logging
    networks:
      - edge
      - services

volumes:
  cms_uploads:
