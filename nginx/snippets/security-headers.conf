# Ojo: add_header en un location anula TODOS los del server (incluido HSTS de ssl.conf).
# Si un location define sus propios add_header, incluir ahí también ssl-headers.conf
# y este snippet.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
