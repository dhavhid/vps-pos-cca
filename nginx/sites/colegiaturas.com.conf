# colegiaturas.com — stack CCA.
#
#   colegiaturas.com / www          -> placeholder de mantenimiento (vps/static/colegiaturas)
#   web.colegiaturas.com            -> cca_web:80     (Astro estático)
#   cms-web.colegiaturas.com        -> cca_cms:1337   (Strapi)
#   portal-padres.colegiaturas.com  -> cca_portal:3000 (Portal Familiar)
#
# Certificados: live/colegiaturas.com (apex + www), live/web.colegiaturas.com,
#               live/cms-web.colegiaturas.com, live/portal-padres.colegiaturas.com

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name colegiaturas.com www.colegiaturas.com web.colegiaturas.com
                cms-web.colegiaturas.com portal-padres.colegiaturas.com;

    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Apex + www: placeholder de mantenimiento
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name colegiaturas.com www.colegiaturas.com;

    ssl_certificate /etc/letsencrypt/live/colegiaturas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colegiaturas.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/colegiaturas;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# Sitio público (Astro)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name web.colegiaturas.com;

    ssl_certificate /etc/letsencrypt/live/web.colegiaturas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.colegiaturas.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/web.colegiaturas.com.access.log main;
    error_log /var/log/nginx/web.colegiaturas.com.error.log;

    location / {
        set $upstream http://cca_web:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# CMS (Strapi: admin + API + media)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cms-web.colegiaturas.com;

    ssl_certificate /etc/letsencrypt/live/cms-web.colegiaturas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms-web.colegiaturas.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    access_log /var/log/nginx/cms-web.colegiaturas.com.access.log main;
    error_log /var/log/nginx/cms-web.colegiaturas.com.error.log;

    # Subida de medios desde el admin.
    client_max_body_size 100M;

    location / {
        set $upstream http://cca_cms:1337;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# Portal Familiar (equivalente al bloque del Caddyfile original)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal-padres.colegiaturas.com;

    ssl_certificate /etc/letsencrypt/live/portal-padres.colegiaturas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal-padres.colegiaturas.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Accesos en JSON para monitoreo / fail2ban (ver cca/docs/portal-familiar.md).
    access_log /var/log/nginx/portal-padres.access.json json;
    error_log /var/log/nginx/portal-padres.error.log;

    # Foto (≤2 MB) + multipart; la API además limita el JSON a 64 KB.
    client_max_body_size 3m;

    # El healthcheck es solo para Docker (dentro de la red); desde internet no existe.
    location = /api/health {
        return 404;
    }

    location / {
        set $upstream http://cca_portal:3000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
