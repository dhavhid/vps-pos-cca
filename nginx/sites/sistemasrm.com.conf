# sistemasrm.com — stack POS.
#
#   sistemasrm.com         -> website estático (/pos-backend/infra/website)
#   www.sistemasrm.com     -> 301 a sistemasrm.com
#   pos.sistemasrm.com     -> pos_static:3001
#   posapi.sistemasrm.com  -> pos_api:3000
#
# Certificados (mismos lineages que el despliegue anterior de pos):
#   live/sistemasrm.com (sistemasrm.com + www), live/pos.sistemasrm.com, live/posapi.sistemasrm.com

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sistemasrm.com www.sistemasrm.com pos.sistemasrm.com posapi.sistemasrm.com;

    include /etc/nginx/snippets/acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sistemasrm.com;

    ssl_certificate /etc/letsencrypt/live/sistemasrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemasrm.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    return 301 https://sistemasrm.com$request_uri;
}

# Apex: website estático
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sistemasrm.com;

    ssl_certificate /etc/letsencrypt/live/sistemasrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistemasrm.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/security-headers.conf;

    access_log /var/log/nginx/sistemasrm.com.access.log main;
    error_log /var/log/nginx/sistemasrm.com.error.log;

    root /var/www/sistemasrm;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Página 404 real, conservando el status 404 para los crawlers.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/snippets/ssl-headers.conf;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# App POS (Expo web)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pos.sistemasrm.com;

    ssl_certificate /etc/letsencrypt/live/pos.sistemasrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.sistemasrm.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    access_log /var/log/nginx/pos.sistemasrm.com.access.log main;
    error_log /var/log/nginx/pos.sistemasrm.com.error.log;

    location / {
        set $upstream http://pos_static:3001;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# API POS (NestJS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name posapi.sistemasrm.com;

    ssl_certificate /etc/letsencrypt/live/posapi.sistemasrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posapi.sistemasrm.com/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    access_log /var/log/nginx/posapi.sistemasrm.com.access.log main;
    error_log /var/log/nginx/posapi.sistemasrm.com.error.log;

    location / {
        set $upstream http://pos_api:3000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
