# Infraestructura unificada del VPS: un solo nginx (+ certbot) al frente de todos los stacks.
#
# Los stacks viven en stacks/<nombre>/compose.yml y se combinan vía COMPOSE_FILE en .env,
# así que `docker compose <cmd>` desde este directorio opera sobre todo a la vez.
# Todas las rutas relativas se resuelven contra este directorio (vps/).
#
# Postgres NO corre aquí: todas las apps usan el cluster administrado de DigitalOcean.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: edge_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Plantillas por dominio; nginx/entrypoint.sh las renderiza en conf.d (tmpfs) al arrancar.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint.sh:/vps/entrypoint.sh:ro
      - ./scripts/hosts.sh:/vps/hosts.sh:ro
      - ./nginx/dhparam:/etc/nginx/dhparam:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Website de sistemasrm.com (${SRM_APEX}): se sirve directo desde el repo de pos.
      - ${POS_BACKEND_DIR:?falta POS_BACKEND_DIR en .env}/infra/website:/var/www/sistemasrm:ro
      # Placeholder de mantenimiento para aulasv.com / www.
      - ./static/colegiaturas:/var/www/colegiaturas:ro
      - nginx_logs:/var/log/nginx
    # conf.d vacío: descarta el default.conf de la imagen (choca con 00-default).
    tmpfs:
      - /etc/nginx/conf.d
    environment:
      # Vacío = producción; "stage" = stage.sistemasrm.com, stagepos.sistemasrm.com, ...
      DOMAIN_PREFIX: ${DOMAIN_PREFIX:-}
      # envsubst solo toca nuestras variables, no las de nginx ($host, $upstream, ...).
      NGINX_ENVSUBST_FILTER: ^(SRM|CCA)_
    # Calcula hostnames, arranca el reload periódico (6h) y ejecuta el entrypoint oficial.
    command: ["/bin/sh", "/vps/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - edge

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: edge_certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
    logging: *default-logging
    networks:
      - edge

volumes:
  nginx_logs:

networks:
  # nginx <-> servicios publicados en internet.
  edge:
    name: vps_edge
  # Red interna compartida: servicios de uso común (jasperservice) y sus consumidores.
  services:
    name: vps_services
